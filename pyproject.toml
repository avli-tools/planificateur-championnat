[project]
name = "planificateur"
version = "0.1.0"
description = "Génère le calendrier des championnats de l'AVLI par optimisation sous contraintes (OR-Tools CP-SAT)."
authors = [
    { name = "Vincent", email = "vincent.guidoux@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ortools>=9.15.6755",
    "pyyaml>=6.0.3",
]

[project.scripts]
planificateur = "planificateur.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Les messages destinés à l'utilisateur sont en français (guillemets « », apostrophes typographiques).
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # E501 : le formateur gère la longueur du code

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
