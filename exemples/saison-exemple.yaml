# Exemple anonymisé : structure de la saison 2025-2026 (dates, indisponibilités,
# présences imposées) avec des noms d'équipes fictifs.
saison: Ligue A — exemple anonymisé

equipes:
  - Équipe A
  - Équipe B
  - Équipe C
  - Équipe D
  - Équipe E
  - Équipe F
  - Équipe G
  - Équipe H
  - Équipe I
  - Équipe J
  - Équipe K

parametres:
  matchs_par_equipe: 4
  matchs_par_date: 1
  organisations_par_equipe: 2
  # Plafonds obligatoires : au plus « maximum » sur toute période de « jours » jours consécutifs.
  # Les écarts entre matchs et entre engagements sont ensuite maximisés par le solveur.
  charge_matchs:
    maximum: 2
    jours: 31
  charge_engagements:               # engagement = jouer ou organiser
    maximum: 3
    jours: 7

